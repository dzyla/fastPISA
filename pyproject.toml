[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastpisa"
version = "0.5.0"
description = "Local PISA interface analysis with an optional COCOMAPS 2.0 contact-map mode"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Dawid Zyla", email = "dawid.zyla@cuanschutz.edu" }]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
keywords = ["pisa", "protein", "interface", "structural-biology", "bioinformatics"]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
]

[project.optional-dependencies]
mmcif = ["gemmi"]
fast = ["freesasa"]
dataframe = ["pandas"]
viz = ["matplotlib"]
# Everything the offline test suite needs to run WITHOUT skipping: the
# accuracy regressions need freesasa + gemmi, and the app-layer tests need
# pandas / matplotlib / openpyxl. CI installs this extra so a green run means
# the tests ran, not that they were skipped.
test = [
    "pytest",
    "freesasa",
    "gemmi",
    "pandas",
    "matplotlib",
    "openpyxl",
]

[project.scripts]
fastpisa = "fastpisa.cli:main"

[tool.setuptools.packages.find]
include = ["fastpisa*"]

[tool.setuptools.package-data]
fastpisa = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Reproducibility tests shell out to an original CCP4 PISA binary and to
# external model files (FASTPISA_* environment variables); the default test
# run does not need those and skips them when unset.
markers = [
    "reproduce: compares fastPISA against the original CCP4 PISA binary",
]