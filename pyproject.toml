[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastpisa"
version = "0.3.0"
description = "Local PISA interface analysis with an optional COCOMAPS 2.0 contact-map mode"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "dzyla" }]
keywords = ["pisa", "protein", "interface", "structural-biology", "bioinformatics"]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
]

[project.optional-dependencies]
mmcif = ["gemmi"]
fast = ["freesasa"]
dataframe = ["pandas"]
viz = ["matplotlib"]

[project.scripts]
fastpisa = "fastpisa.cli:main"

[tool.setuptools.packages.find]
include = ["fastpisa*"]

[tool.setuptools.package-data]
fastpisa = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Reproducibility tests shell out to an original CCP4 PISA binary and to
# external model files (FASTPISA_* environment variables); the default test
# run does not need those and skips them when unset.
markers = [
    "reproduce: compares fastPISA against the original CCP4 PISA binary",
]