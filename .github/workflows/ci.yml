name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        sasa-backend: ["freesasa", "pure-python"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest gemmi
          if [ "${{ matrix.sasa-backend }}" = "freesasa" ]; then pip install freesasa; fi
      - name: Run tests (offline; includes accuracy regression vs cached EBI PISA reference)
        run: pytest tests/ -q
